name: RevenueDashboard
options:
    deploymentTarget: { iOS: "17.0", macOS: "14.0" }
packages:
  RevenueKit: { path: . }
targets:
  RevenueDashboard:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    dependencies:
      - { package: RevenueKit, product: RevenueKit }
    settings:
      base:
        PRODUCT_NAME: Revenue
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_APP_SANDBOX: NO
        INFOPLIST_KEY_CFBundleDisplayName: Revenue
        INFOPLIST_KEY_GoogleClientID: $(GOOGLE_CLIENT_ID)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
