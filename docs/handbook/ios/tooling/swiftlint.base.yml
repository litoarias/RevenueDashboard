# Shared SwiftLint base, synced into every iOS project at
# docs/handbook/ios/tooling/swiftlint.base.yml. Do not edit the synced copy.
# Projects inherit it from their own .swiftlint.yml:
#
#   parent_config: docs/handbook/ios/tooling/swiftlint.base.yml
#   included: [MyApp, MyAppTests]
#
# Rule IDs in messages refer to the engineering handbook.

excluded:
  - build
  - .build
  - DerivedData
  - Pods

check_for_updates: false

# Formatting is not linted: it creates churn without catching bugs
# (IOS-QUAL-005). Use Xcode's re-indent or swift-format for layout.
disabled_rules:
  - nesting
  - todo
  - trailing_whitespace
  - vertical_whitespace
  - trailing_newline
  - leading_whitespace
  - comma
  - colon
  - trailing_comma
  - opening_brace
  - closing_brace
  - statement_position
  - switch_case_alignment
  - comment_spacing
  - return_arrow_whitespace
  - vertical_parameter_alignment
  - multiple_closures_with_trailing_closure
  - implicit_optional_initialization
  - redundant_discardable_let

opt_in_rules:
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discarded_notification_center_observer
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - identical_operands
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - unavailable_function
  - yoda_condition

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 300
  error: 450

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 15
  ignores_case_statements: true

identifier_name:
  min_length: 1          # short closure and loop names are fine in context
  max_length:
    warning: 50
    error: 70
  excluded: [id, x, y, URL]

type_name:
  min_length: 3
  excluded: [ID]

custom_rules:
  domain_imports_foundation_only:
    included: ".*/Domain/.*\\.swift"
    name: "Domain imports Foundation only (IOS-ARCH-001)"
    regex: "(?m)^import\\s+(?!Foundation\\s*$|Observation\\s*$)\\w+"
    message: "Domain must stay independent from UI, persistence, Data, and SDKs."
    severity: error

  dto_outside_data:
    included: ".*/(Domain|Presentation)/.*\\.swift"
    name: "DTO outside Data (IOS-STRUCT-004)"
    regex: "\\b[A-Z][A-Za-z0-9]*DTOs?\\b"
    message: "Map DTOs to domain models before values leave Data."
    severity: error

  direct_url_session:
    included: ".*/(Presentation|Domain|Data/Repositories)/.*\\.swift"
    name: "Direct URLSession (IOS-NET-001)"
    regex: "\\bURLSession\\b"
    message: "Use the project's shared HTTP client."
    severity: warning

  main_actor_outside_ui:
    included: ".*/(Domain|Data)/.*\\.swift"
    name: "MainActor outside UI (IOS-CONC-004)"
    regex: "@MainActor"
    message: "Do not isolate non-UI layers to MainActor to silence diagnostics. Document real exceptions with swiftlint:disable:next."
    severity: warning

  manual_main_queue_hop:
    name: "Manual main queue hop (IOS-CONC-008)"
    regex: "DispatchQueue\\.main\\.(async|sync)"
    message: "Use @MainActor and structured concurrency."
    severity: warning

  detached_task:
    name: "Detached task (IOS-CONC-008)"
    regex: "Task\\.detached"
    message: "Prefer structured tasks; justify detached work explicitly."
    severity: warning

  on_appear_task:
    name: "onAppear + Task (IOS-UI-003)"
    regex: "\\.onAppear\\s*\\{\\s*Task\\s*\\{"
    message: "Use .task { } so work is cancelled with the view."
    severity: warning

  direct_console_output:
    name: "print/dump (IOS-LOG-001)"
    regex: "(?<![.\\w])(print|dump)\\s*\\("
    message: "Use os.Logger."
    severity: warning
